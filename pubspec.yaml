name: folha_app
description: "Folha — sua vida financeira, escrita com clareza."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management, DI, routing
  get: ^4.7.2

  # Networking (preparado para backend real)
  dio: ^5.7.0

  # Formatação BR (datas, moeda)
  intl: ^0.20.2

  # Tipografia (Instrument Serif + DM Sans via Google Fonts)
  google_fonts: ^6.3.2

  # SVG (logo, leaf-mark)
  flutter_svg: ^2.2.0

  # Ícones Lucide (mesma família do design system)
  lucide_icons: ^0.257.0

  # Equatable para entidades / value objects
  equatable: ^2.0.7

  # Dartz para Either (Failure | Success) no padrão Clean Arch
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
